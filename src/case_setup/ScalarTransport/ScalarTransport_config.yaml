---
title: ScalarTransport

# restart capability
restart: false

# unstaedy state
unsteady: true

#  number of steady iterations
iterations: 10

#  number of timesteps
steps: 100
# time step size
dt: 1.0e-2

mesh: 2d
# Square/cubic mesh generation parameters
# cells per side
cps: 16
# domain size
L: 1.0

target_residual: 1.0e-10

# Frequency (in terms of timesteps) of writing solution to file
write_frequency: 5

### VALUES BELOW THIS POINT ARE NOT CURRENTLY USED

#reference_numbers:
#    pressure: 101325.0
#    temperature: 289.0
#    density: 1.0
#    viscosity: 1.0e-03
#    pref_at_cell: 4096

#solve:
#  w: off

#init: 
#  type: user

#monitor_cell: 1990

# 1 = central
#convection_scheme:
#  u: 1 
#  v: 1
#  w: 1

#blending_factor:
#  u: 1.0
#  v: 1.0
#  w: 1.0
  
#output:
#  every: 1000

post:
  type: center
  variables: [whisky, water]

variables:
  store_residuals: false
  n_variables: 5
  variable_1:
    name: whisky
    type: central
    solve: on
    relaxation_factor: 0.9
  variable_2:
    name: water
    type: upwind
    solve: on
    relaxation_factor: 0.9
  variable_3:
    name: u
    type: central
  variable_4:
    name: v
    type: central
  variable_5:
    name: w
    type: central

boundaries:
  n_boundaries: 4
  boundary_1: 
    name: left
    type: neumann
    value: 0
  boundary_2:
    name: right
    type: neumann
    value: 0
  boundary_3:
    name: bottom
    type: neumann
    value: 0
  boundary_4:
    name: top
    type: neumann
    value: 0
  boundary_5:
    name: back
    type: neumann
    value: 0
  boundary_6:
    name: front
    type: neumann
    value: 0
